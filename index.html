<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Promedio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="cont1">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label>Nota 1:</label>
        <input type="number" id="nota1" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="nota2" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="nota3" step="0.1">

        <button onclick="calc()">Calcular</button>

        <p id="r"></p>
        <p id="r2"></p>
    </div>

<script>


let notas = [];
let promedio = 0;
let numeroNotas = 3;

function calcularPromedioFn() {

    let nota1 = parseFloat(document.getElementById("nota1").value);
    let nota2 = parseFloat(document.getElementById("nota2").value);
    let nota3 = parseFloat(document.getElementById("nota3").value);

    console.log("valores capturados:", nota1, nota2, nota3);

    if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
        document.getElementById("r").innerHTML = "Debe ingresar las tres notas.";
        return;
    }

    promedio = (nota1 + nota2 + nota3) / numeroNotas;

    document.getElementById("r").innerHTML = "Promedio: " + promedio.toFixed(2);

    if (promedio >= 3.0) {
        document.getElementById("r2").innerHTML = "Resultado: aprobado";
    } else {
        document.getElementById("r2").innerHTML = "Resultado: reprobado";
    }

    console.log("promedio calculado");
}

console.log("pagina cargada");

</script>

</body>
</html>
